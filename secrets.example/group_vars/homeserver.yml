---
# Copy to group_vars/homeserver.yml in the secrets repository. Only values that
# differ from the role defaults belong here; README.md, "Configuration", lists
# them. Every host shares this file. Credentials and host-only values go to
# host_vars/<host>.yml.

# The public hostnames. The proxy sites, the trusted domain and the ntfy URL
# follow from them.
nextcloud_hostname: cloud.example.com
# The ntfy site needs its own DNS record. Empty: no ntfy site.
ntfy_hostname: ""
