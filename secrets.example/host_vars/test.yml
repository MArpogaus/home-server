---
# Copy to host_vars/<host>.yml in the secrets repository, where <host> is the
# host's name in inventory.yml, such as test. Values here win over
# group_vars/homeserver.yml, which every host shares. Each host has its own
# credentials, so a test VM never holds a production one. Encrypt the file.

nextcloud_service_db_password: ""
nextcloud_service_admin_password: ""
# The phone logs in as ntfy; Alertmanager posts as alertmanager; coding agents
# use their own agent-<name> topics. A token is tk_ plus 29 lowercase letters
# or digits.
ntfy_service_users:
  ntfy:
    password: ""
    access: {alerts: rw, "agent*": rw}
  alertmanager:
    token: ""
    access: {alerts: wo}
  agent:
    token: ""
    access: {"agent*": rw}
monitoring_service_grafana_admin_password: ""

# A SecureBlue host needs the platform steps. A host with steps of its own names
# its own file, which includes this one.
host_tasks_pre: "{{ playbook_dir }}/platform/secureblue.yml"

# A host without public DNS (the test VM) serves a self-signed certificate.
# A real host deletes this line and gets one from Let's Encrypt.
bunker_service_certificates: self-signed

# The test VM follows the image the dev branch publishes. A real host deletes
# this line and follows the role default.
nextcloud_service_app_image: "ghcr.io/marpogaus/nextcloud:35-dev"

# Real hardware only: the public URLs to probe, which must resolve and answer
# or PublicUrlDown fires. The test VM probes nothing.
# monitoring_service_probe_urls:
#   - https://cloud.example.com/status.php
#   - https://ntfy.example.com/v1/health

# Real hardware only: the backup target, formatted as README.md, "Backup and
# restore", says.
# base_setup_backup_targets: [{uuid: "", name: nas}]
# base_setup_iscsi_portal: ""
# base_setup_iscsi_target: ""
# base_setup_luks_passphrase: ""
