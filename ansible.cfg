[defaults]
inventory = inventory, ../home-server-secrets/inventory.yml
vault_password_file = ~/.config/home-server/vault-password
interpreter_python = /usr/bin/python3
force_handlers = True

[privilege_escalation]
become = True
become_method = community.general.run0
become_exe = TERM=dumb run0

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
ssh_extra_args = -o RequestTTY=force
