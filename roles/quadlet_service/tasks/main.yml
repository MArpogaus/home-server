---
- name: Assert the required variables are set
  ansible.builtin.assert:
    # An unset, null or empty value compares as ''; no regex means not empty.
    that: lookup('vars', item.key, default='') | default('', true) | string is match(item.value or '.')
    fail_msg: >-
      {% if item.key == 'service_port' %}Give the {{ service_name }} entry of base_setup_services a port.
      home-server/README.md, "Adding a service".{% else %}Set {{ item.key }}{{ (' to match ' ~ item.value) if item.value else '' }}.
      home-server-{{ service_name }}/README.md, "Configuration".{% endif %}
    quiet: true
  loop: "{{ quadlet_service_required | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Assert every container has a memory ceiling and every CPU quota a container
  ansible.builtin.assert:
    that:
      - quadlet_service_memory.keys() | sort == quadlet_service_containers | sort
      - quadlet_service_cpu.keys() | difference(quadlet_service_containers) | length == 0
    fail_msg: >-
      The memory ceilings name {{ quadlet_service_memory.keys() | sort | join(', ') }},
      the CPU quotas name {{ quadlet_service_cpu.keys() | sort | join(', ') }},
      the containers are {{ quadlet_service_containers | sort | join(', ') }}.
    quiet: true
  vars:
    quadlet_service_containers: >-
      {{ query('community.general.filetree', service_repo ~ '/quadlets/') | map(attribute='path')
         | select('match', '^' ~ service_name ~ '-[^/]+[.]container([.]j2)?$')
         | map('regex_replace', '^' ~ service_name ~ '-', '') | map('regex_replace', '[.]container([.]j2)?$', '') | list }}

# An empty value is an optional secret that is not set. A container reads a
# secret when it starts, so a new value restarts the pod.
- name: Store the secrets as Podman secrets
  become: true
  become_user: "{{ service_name }}"
  containers.podman.podman_secret:
    name: "{{ item.key }}"
    data: "{{ item.value | string }}"
  loop: "{{ quadlet_service_secrets | dict2items | rejectattr('value', 'in', ['', None]) }}"
  loop_control:
    label: "{{ item.key }}"
  register: quadlet_service_secret_replaced
  no_log: true

# One archive per service instead of one SSH round trip per file.
# README.md, "Design decisions".
- name: Stage the Quadlets on the controller
  ansible.builtin.tempfile:
    state: directory
    suffix: "-{{ service_name }}-quadlets"
  register: quadlet_service_stage
  delegate_to: localhost
  become: false
  changed_when: false

- name: Ship the stage
  vars:
    quadlet_service_files_changed: >-
      {{ not quadlet_service_unpacked.stat.exists
         or quadlet_service_unpacked.stat.checksum != quadlet_service_pack.stdout.split()[0] }}
  block:
    - name: Copy the static files into the stage
      ansible.builtin.shell:
        cmd: |
          set -eu
          # cp takes the modes from the umask; the host needs 0644 and 0755.
          umask 022
          stage={{ quadlet_service_stage.path | quote }}
          cp -r {{ (role_path ~ '/files/container.d') | quote }} "$stage/"
          cp -r {{ (service_repo ~ '/quadlets/.') | quote }} "$stage/"
          printf '[Container]\nPod=%s.pod\n' {{ service_name | quote }} > "$stage/container.d/pod.conf"
          find "$stage" -name '*.j2' -delete
          {% for name, size in quadlet_service_memory.items() %}
          mkdir -p "$stage"/{{ (service_name ~ '-' ~ name ~ '.container.d') | quote }}
          printf '[Container]\nMemory=%s\n' {{ size | quote }} > "$stage"/{{ (service_name ~ '-' ~ name ~ '.container.d/memory.conf') | quote }}
          {% endfor %}
          {% for name, quota in quadlet_service_cpu.items() %}
          printf '[Service]\nCPUQuota=%s\n' {{ quota | quote }} > "$stage"/{{ (service_name ~ '-' ~ name ~ '.container.d/cpu.conf') | quote }}
          {% endfor %}
          {% for f in quadlet_service_extra_files %}
          mkdir -p "$(dirname "$stage"/{{ f.dest | quote }})"
          {% endfor %}
      delegate_to: localhost
      become: false
      changed_when: false

    - name: Write the generated files into the stage
      ansible.builtin.copy:
        content: "{{ item.content }}"
        dest: "{{ quadlet_service_stage.path }}/{{ item.dest }}"
        mode: "0644"
      diff: false
      loop: "{{ quadlet_service_extra_files }}"
      loop_control:
        label: "{{ item.dest }}"
      delegate_to: localhost
      become: false
      changed_when: false

    - name: Render the templates into the stage
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "{{ quadlet_service_stage.path }}/{{ item.path | regex_replace('\\.j2$', '') }}"
        mode: "0644"
      diff: false
      loop: "{{ query('community.general.filetree', service_repo ~ '/quadlets/')
                | selectattr('state', 'equalto', 'file') | selectattr('path', 'search', '\\.j2$') | list }}"
      loop_control:
        label: "{{ item.path }}"
      delegate_to: localhost
      become: false
      changed_when: false

    # Fixed mtimes and top-level entries only, so an unchanged tree packs to
    # the same bytes and the same checksum.
    - name: Pack the stage
      ansible.builtin.shell:  # noqa: command-instead-of-module  (no module creates an archive with fixed mtimes)
        cmd: >-
          set -o pipefail &&
          umask 077 &&
          cd {{ quadlet_service_stage.path | quote }} &&
          ls -A | tar --create --gzip --sort=name --owner=0 --group=0 --numeric-owner
          --mtime='2000-01-01 00:00:00' --files-from - --file {{ quadlet_service_stage.path | quote }}.tgz &&
          sha1sum {{ quadlet_service_stage.path | quote }}.tgz
        executable: /bin/bash
      register: quadlet_service_pack
      delegate_to: localhost
      become: false
      changed_when: false

    - name: Read the checksum of the archive last unpacked on the host
      ansible.builtin.stat:
        path: "{{ quadlet_service_dir }}.tgz"
        get_checksum: true
        checksum_algorithm: sha1
      register: quadlet_service_unpacked
      become: true
      become_user: "{{ service_name }}"

    # The directory holds exactly the archive, so a file that left the repo
    # leaves the host. The service user owns the home, so it does the work: a
    # symlink it put there reaches only what it may write anyway.
    - name: Replace the Quadlet directory when the archive changed
      when: quadlet_service_files_changed
      become: true
      become_user: "{{ service_name }}"
      block:
        # A run that fails from here on leaves no record, so the next deploy
        # replaces the directory again.
        - name: Forget the archive last unpacked
          ansible.builtin.file:
            path: "{{ quadlet_service_dir }}.tgz"
            state: absent

        - name: Remove the old Quadlet directory
          ansible.builtin.file:
            path: "{{ quadlet_service_dir }}"
            state: absent

        - name: Create the Quadlet directory
          ansible.builtin.file:
            path: "{{ quadlet_service_dir }}"
            state: directory
            mode: "0755"

        # As a user, tar applies the umask; the modes of the stage stay.
        - name: Unpack the Quadlets, drop-ins and configs
          ansible.builtin.unarchive:
            src: "{{ quadlet_service_stage.path }}.tgz"
            dest: "{{ quadlet_service_dir }}/"
            extra_opts: [--preserve-permissions]
          register: quadlet_service_unpack

    - name: Start the pod, or restart it when its files changed
      ansible.builtin.systemd_service:
        name: "{{ service_name }}-pod.service"
        scope: user
        daemon_reload: "{{ quadlet_service_changed }}"
        state: "{{ 'restarted' if quadlet_service_restart | bool or quadlet_service_changed or quadlet_service_secret_replaced is changed else 'started' }}"
      become: true
      become_user: "{{ service_name }}"
      vars:
        quadlet_service_changed: "{{ quadlet_service_unpack is changed }}"

    - name: Keep the archive as the record of what is unpacked
      ansible.builtin.copy:
        src: "{{ quadlet_service_stage.path }}.tgz"
        dest: "{{ quadlet_service_dir }}.tgz"
        mode: "0600"
      when: quadlet_service_files_changed
      become: true
      become_user: "{{ service_name }}"
  always:
    - name: Remove the stage
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ quadlet_service_stage.path }}"
        - "{{ quadlet_service_stage.path }}.tgz"
      delegate_to: localhost
      become: false
      changed_when: false
