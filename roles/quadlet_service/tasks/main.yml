---
# One archive per service instead of one SSH round trip per file.
# README.md, "Design decisions".
- name: Stage the Quadlets on the controller
  ansible.builtin.tempfile:
    state: directory
    suffix: "-{{ service_name }}-quadlets"
  register: quadlet_service_stage
  delegate_to: localhost
  become: false
  changed_when: false

- name: Ship the stage
  vars:
    quadlet_service_files_changed: >-
      {{ not quadlet_service_unpacked.stat.exists
         or quadlet_service_unpacked.stat.checksum != quadlet_service_pack.stdout.split()[0] }}
  block:
    - name: Copy the static files into the stage
      ansible.builtin.shell:
        cmd: |
          set -eu
          stage={{ quadlet_service_stage.path | quote }}
          cp -r {{ (role_path ~ '/files/container.d') | quote }} "$stage/"
          cp -r {{ (service_repo ~ '/quadlets/.') | quote }} "$stage/"
          find "$stage" -name '*.j2' -delete
          {% for f in quadlet_service_extra_files %}
          mkdir -p "$(dirname "$stage"/{{ f.dest | quote }})"
          {% if f.src is defined %}
          cp -r {{ f.src | quote }} "$stage"/{{ f.dest | quote }}
          {% endif %}
          {% endfor %}
      delegate_to: localhost
      become: false
      changed_when: false

    - name: Write the generated files into the stage
      ansible.builtin.copy:
        content: "{{ item.content }}"
        dest: "{{ quadlet_service_stage.path }}/{{ item.dest }}"
        mode: "0644"
      loop: "{{ quadlet_service_extra_files | selectattr('content', 'defined') | list }}"
      loop_control:
        label: "{{ item.dest }}"
      delegate_to: localhost
      become: false
      changed_when: false

    - name: Render the templates into the stage
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "{{ quadlet_service_stage.path }}/{{ item.path | regex_replace('\\.j2$', '') }}"
        mode: "0644"
      loop: "{{ query('community.general.filetree', service_repo ~ '/quadlets/')
                | selectattr('state', 'equalto', 'file') | selectattr('path', 'search', '\\.j2$') | list }}"
      loop_control:
        label: "{{ item.path }}"
      delegate_to: localhost
      become: false
      changed_when: false

    # In the stage, so the mode is part of the archive and its checksum.
    - name: Restrict the config files that must not be world-readable
      ansible.builtin.file:
        path: "{{ quadlet_service_stage.path }}/configs/{{ item.key }}"
        mode: "{{ item.value }}"
      loop: "{{ quadlet_service_config_modes | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      delegate_to: localhost
      become: false
      changed_when: false

    # Fixed mtimes and top-level entries only, so an unchanged tree packs to
    # the same bytes and the same checksum.
    - name: Pack the stage
      ansible.builtin.shell:  # noqa: command-instead-of-module  (no module creates an archive with fixed mtimes)
        cmd: >-
          set -o pipefail &&
          umask 077 &&
          cd {{ quadlet_service_stage.path | quote }} &&
          ls -A | tar --create --gzip --sort=name --owner=0 --group=0 --numeric-owner
          --mtime='2000-01-01 00:00:00' --files-from - --file {{ quadlet_service_stage.path | quote }}.tgz &&
          sha1sum {{ quadlet_service_stage.path | quote }}.tgz
        executable: /bin/bash
      register: quadlet_service_pack
      delegate_to: localhost
      become: false
      changed_when: false

    - name: Read the checksum of the archive last unpacked on the host
      ansible.builtin.stat:
        path: "{{ quadlet_service_dir }}.tgz"
        get_checksum: true
        checksum_algorithm: sha1
      register: quadlet_service_unpacked

    # The directory holds exactly the archive, so a file that left the repo
    # leaves the host.
    - name: Replace the Quadlet directory when the archive changed
      when: quadlet_service_files_changed
      block:
        # A run that fails from here on leaves no record, so the next deploy
        # replaces the directory again.
        - name: Forget the archive last unpacked
          ansible.builtin.file:
            path: "{{ quadlet_service_dir }}.tgz"
            state: absent

        - name: Remove the old Quadlet directory
          ansible.builtin.file:
            path: "{{ quadlet_service_dir }}"
            state: absent

        - name: Create the Quadlet directory
          ansible.builtin.file:
            path: "{{ quadlet_service_dir }}"
            state: directory
            owner: "{{ service_name }}"
            group: "{{ service_name }}"
            mode: "0755"

        - name: Unpack the Quadlets, drop-ins and configs
          ansible.builtin.unarchive:
            src: "{{ quadlet_service_stage.path }}.tgz"
            dest: "{{ quadlet_service_dir }}/"
            owner: "{{ service_name }}"
            group: "{{ service_name }}"
          register: quadlet_service_unpack

    - name: Start the pod, or restart it when its files changed
      ansible.builtin.systemd_service:
        name: "{{ service_name }}-pod.service"
        scope: user
        daemon_reload: "{{ quadlet_service_changed }}"
        state: "{{ 'restarted' if quadlet_service_restart | bool or quadlet_service_changed else 'started' }}"
      become: true
      become_user: "{{ service_name }}"
      vars:
        quadlet_service_changed: "{{ quadlet_service_unpack is changed }}"

    - name: Keep the archive as the record of what is unpacked
      ansible.builtin.copy:
        src: "{{ quadlet_service_stage.path }}.tgz"
        dest: "{{ quadlet_service_dir }}.tgz"
        owner: "{{ service_name }}"
        group: "{{ service_name }}"
        mode: "0600"
      when: quadlet_service_files_changed
  always:
    - name: Remove the stage
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ quadlet_service_stage.path }}"
        - "{{ quadlet_service_stage.path }}.tgz"
      delegate_to: localhost
      become: false
      changed_when: false
