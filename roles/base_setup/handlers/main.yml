---
# The swap unit pulls in systemd-zram-setup@, which alone activates nothing.
- name: Start zram swap
  ansible.builtin.systemd:
    name: dev-zram0.swap
    state: started
    daemon_reload: true

- name: Restart iscsid
  ansible.builtin.systemd:
    name: iscsid.service
    state: restarted

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
