---
- name: Set the iSCSI initiator name
  ansible.builtin.copy:
    content: "InitiatorName={{ base_setup_iscsi_initiator }}\n"
    dest: /etc/iscsi/initiatorname.iscsi
    owner: root
    mode: "0600"
  notify: Restart iscsid

- name: Start iscsid
  ansible.builtin.systemd_service:
    name: iscsid.service
    enabled: true
    state: started

- name: Apply the initiator name now
  ansible.builtin.meta: flush_handlers

- name: Discover the target, log in, and log in again at boot
  community.general.open_iscsi:
    portal: "{{ base_setup_iscsi_portal }}"
    target: "{{ base_setup_iscsi_target }}"
    discover: true
    login: true
    auto_node_startup: true

- name: Read the target's session settings
  ansible.builtin.command: iscsiadm -m node -T {{ base_setup_iscsi_target }} -p {{ base_setup_iscsi_portal }}
  register: base_setup_iscsi_node
  changed_when: false

- name: Hold I/O while the target is gone instead of failing it
  ansible.builtin.command: >-
    iscsiadm -m node -T {{ base_setup_iscsi_target }} -p {{ base_setup_iscsi_portal }} -o update
    -n node.session.timeo.replacement_timeout -v {{ base_setup_iscsi_replacement_timeout }}
  when: ('node.session.timeo.replacement_timeout = ' ~ base_setup_iscsi_replacement_timeout) not in base_setup_iscsi_node.stdout_lines
  changed_when: true

- name: Wait for the LUN to appear
  ansible.builtin.wait_for:
    path: /dev/disk/by-path/ip-{{ base_setup_iscsi_portal }}:3260-iscsi-{{ base_setup_iscsi_target }}-lun-0
    timeout: 60
