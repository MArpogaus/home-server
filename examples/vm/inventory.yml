---
# The test VM of test/start_vm.py. Deploy it with:
#   ansible-playbook -i examples/vm site.yml -l test
all:
  hosts:
    test:
      ansible_host: 127.0.0.1
      ansible_port: 2222
      ansible_ssh_private_key_file: test/coreos_key
      # Every --fresh build gets a new host key.
      ansible_ssh_common_args: >-
        -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o IdentitiesOnly=yes
