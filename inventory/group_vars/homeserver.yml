---
# What this deployment runs. base_setup configures a host; this says what the
# host is for, so the role carries no service names of its own.
# A uid never changes: home-server-core/README.md, "Adding a service".
base_setup_services:
  - name: nextcloud
    uid: 82
    repo: nextcloud
  - name: proxy
    uid: 1001
    repo: bunker
  - name: monitoring
    uid: 1002
    repo: monitoring
    # Alloy reads the host journal.
    groups: [systemd-journal]
