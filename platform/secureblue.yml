---
- name: Read whether container domains may create user namespaces
  ansible.builtin.command: ujust set-container-userns status
  register: secureblue_container_userns
  changed_when: false

- name: Allow container domains to create user namespaces
  ansible.builtin.command: ujust set-container-userns on
  when: "'disabled' in secureblue_container_userns.stdout"
  changed_when: true

- name: Make iscsid a permissive SELinux domain
  community.general.selinux_permissive:
    name: iscsid_t
    permissive: true
  when: base_setup_iscsi_portal | default('') | length > 0

- name: Ensure firewalld is running
  ansible.builtin.systemd_service:
    name: firewalld
    state: started
    enabled: true

- name: Open the firewall services
  ansible.posix.firewalld:
    service: "{{ item }}"
    state: enabled
    permanent: true
    immediate: true
  loop: [ssh, http, https]

- name: Allow local port forwarding for the admin user
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/90-core-forwarding.conf
    content: |
      Match User core
        AllowTcpForwarding local
      Match all
    owner: root
    mode: "0600"
    validate: sshd -t -f %s
  register: secureblue_sshd_forwarding

- name: Drop dead SSH clients
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/90-client-alive.conf
    content: |
      ClientAliveInterval 300
    owner: root
    mode: "0600"
    validate: sshd -t -f %s
  register: secureblue_sshd_client_alive

- name: Reload sshd
  ansible.builtin.systemd_service:
    name: sshd.service
    state: reloaded
  when: secureblue_sshd_forwarding is changed or secureblue_sshd_client_alive is changed

- name: Silence the MOTD for the admin user's SSH sessions
  ansible.builtin.file:
    path: "~core/.config/{{ item.name }}"
    state: "{{ item.state }}"
    owner: core
    group: core
    mode: "{{ item.mode }}"
    modification_time: preserve
    access_time: preserve
  loop:
    - {name: "", state: directory, mode: "0700"}
    - {name: no-show-user-motd, state: touch, mode: "0600"}
  loop_control:
    label: "{{ item.name | default('.config', true) }}"
