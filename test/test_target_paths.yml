---
# ansible-playbook test/test_target_paths.yml
- name: The stale-target cleanup keeps every listed target's files
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../roles/base_setup/vars/main.yml
  vars:
    base_setup_backup_targets: [{name: usb}, {name: nas}]
  tasks:
    - name: Check the keep list
      ansible.builtin.assert:
        that:
          - base_setup_target_paths | sort == ['/etc/btrfs-backup/nas.conf', '/etc/btrfs-backup/usb.conf',
            '/var/lib/node-textfile/backup-nas.prom', '/var/lib/node-textfile/backup-usb.prom']
        fail_msg: "{{ base_setup_target_paths }}"
