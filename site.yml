---
# Fact gathering already needs Python and root, so these checks use raw only.
- name: Check that the host is ready
  hosts: all
  gather_facts: false
  become: false
  tags: always
  tasks:
    - name: Refuse a run without -l
      ansible.builtin.assert:
        that: ansible_limit is defined
        fail_msg: Pass -i <deployment dir>/inventory.yml and -l <host>. Without -l the playbook runs on every host of the inventory.
        quiet: true

    - name: Look for Python and the root gate
      ansible.builtin.raw: test -x /usr/bin/python3 && echo python; test -e /run/polkit/root-gate && echo gate
      register: base_ready
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Refuse a host without Python
      ansible.builtin.assert:
        that: "'python' in base_ready.stdout_lines"
        fail_msg: >-
          The host has no /usr/bin/python3. On SecureBlue the platform installs it;
          wait for the rebase reboot.
        quiet: true

    - name: Refuse a run while the root gate is closed
      ansible.builtin.assert:
        that: "'gate' in base_ready.stdout_lines"
        fail_msg: The root gate is closed. Run `root-gate on` as core on the host; README.md, "Deploy".
        quiet: true

- name: Base setup and services
  hosts: all
  pre_tasks:
    - name: Locate each service repository in services/
      ansible.builtin.set_fact:
        base_setup_services: >-
          {{ base_setup_services | map(attribute='name')
             | map('regex_replace', '^', playbook_dir ~ '/services/')
             | map('community.general.dict_kv', 'dir') | zip(base_setup_services) | map('combine') | list }}

    - name: Run what this host needs before the base setup
      ansible.builtin.include_tasks: "{{ host_tasks_pre }}"
      # A key test, so a value that does not resolve fails instead of skipping.
      when: "'host_tasks_pre' in hostvars[inventory_hostname]"
  roles:
    - base_setup
  post_tasks:
    - name: Deploy each service role  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: "{{ service_repo }}/ansible-role/{{ svc.name }}_service"
      vars:
        service_name: "{{ svc.name }}"
        service_home: "{{ base_setup_services_dir }}/{{ svc.name }}"
        service_repo: "{{ svc.dir }}"
        service_port: "{{ svc.port | default(none) }}"
      loop: "{{ base_setup_services }}"
      loop_control:
        loop_var: svc
